# Netlify build settings. Netlify detects Next.js and adds its Next.js
# adapter automatically (kept up to date by Netlify), so no plugin is
# pinned here.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Same Node version as local development.
  NODE_VERSION = "24"
  # Next.js telemetry off in CI builds.
  NEXT_TELEMETRY_DISABLED = "1"

# Environment variables are NOT set in this file (it is in git).
# Set them in Netlify: Site configuration > Environment variables.
# See "Deploy to Netlify" in README.md.
